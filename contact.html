<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Karina</title>
<meta name="description" content="Contactez Karina, photographe de mariage.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23000000%22/%3E%3Ctext%20x%3D%2250%22%20y%3D%2270%22%20font-family%3D%22Georgia%2C%20%27Times%20New%20Roman%27%2C%20serif%22%20font-size%3D%2262%22%20font-weight%3D%22400%22%20fill%3D%22%23ffffff%22%20text-anchor%3D%22middle%22%3EK%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Pinyon+Script&family=Viaoda+Libre&display=swap" rel="stylesheet">

<style>
  /* ==========================================================
     RESET & VARIABLES
  ========================================================== */
  :root {
    --black: #000000;
    --white: #ffffff;
    --font-display: 'Viaoda Libre', serif;
    --font-script: 'Pinyon Script', cursive;
    --font-body: 'DM Sans', sans-serif;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    background-color: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  a {
    color: var(--white);
    text-decoration: none;
  }

  /* ==========================================================
     ANIMATIONS — fondu discret à l'entrée
  ========================================================== */
  .load-in {
    opacity: 0;
    transform: translateY(16px);
    animation: fadeRiseIn 1s ease forwards;
  }

  .load-in-d1 {
    animation-delay: 0.15s;
  }

  .load-in-d2 {
    animation-delay: 0.3s;
  }

  @keyframes fadeRiseIn {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .reveal {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  .reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .load-in {
      animation: none;
      opacity: 1;
      transform: none;
    }

    .reveal {
      transition: none;
      opacity: 1;
      transform: none;
    }
  }

  /* ==========================================================
     NAVBAR — identique aux autres pages
  ========================================================== */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 100;
    background: transparent;
    padding: 1.75rem 2rem;
  }

  .navbar nav ul {
    list-style: none;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(1.5rem, 4vw, 3.5rem);
  }

  .navbar nav a {
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--white);
    position: relative;
    padding-bottom: 4px;
  }

  .navbar nav a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 1px;
    background: var(--white);
    transition: width 0.3s ease;
  }

  .navbar nav a:hover::after,
  .navbar nav a:focus::after,
  .navbar nav a.active::after {
    width: 100%;
  }

  /* ==========================================================
     EN-TÊTE DE PAGE
  ========================================================== */
  .page-header {
    text-align: center;
    padding: 9rem 1.5rem 1rem;
  }

  .page-header h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2.5rem, 6vw, 4rem);
    letter-spacing: 0.02em;
  }

  .page-header p {
    font-family: var(--font-script);
    font-style: italic;
    font-size: clamp(1.25rem, 3vw, 1.75rem);
    margin-top: 0.5rem;
    opacity: 0.9;
  }

  /* ==========================================================
     CONTENU PRINCIPAL — centré, prend l'espace restant
  ========================================================== */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem 5rem;
  }

  .contact-wrap {
    width: 100%;
    max-width: 480px;
    text-align: center;
  }

  /* ==========================================================
     FORMULAIRE — espacement généreux, champs minimalistes
  ========================================================== */
  .contact-form {
    display: flex;
    flex-direction: column;
    gap: 2.75rem;
    text-align: left;
  }

  .field {
    position: relative;
  }

  .field label {
    display: block;
    font-family: var(--font-body);
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
    margin-bottom: 0.75rem;
  }

  .field input,
  .field textarea {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.4);
    color: var(--white);
    font-family: var(--font-body);
    font-size: 1rem;
    padding: 0.5rem 0.1rem;
    outline: none;
    transition: border-color 0.3s ease;
    resize: none;
  }

  .field input::placeholder,
  .field textarea::placeholder {
    color: rgba(255, 255, 255, 0.35);
    font-family: var(--font-body);
    font-weight: 300;
  }

  .field input:focus,
  .field textarea:focus {
    border-bottom-color: var(--white);
    color: var(--white);
  }

  .field textarea {
    min-height: 110px;
    line-height: 1.6;
  }

  /* ==========================================================
     BOUTON ENVOYER — inversion au survol
  ========================================================== */
  .submit-btn {
    align-self: center;
    margin-top: 0.5rem;
    background: var(--white);
    color: var(--black);
    border: 1px solid var(--white);
    font-family: var(--font-body);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.95rem 2.75rem;
    cursor: pointer;
    transition: background-color 0.35s ease, color 0.35s ease;
  }

  .submit-btn:hover,
  .submit-btn:focus-visible {
    background: var(--black);
    color: var(--white);
  }

  /* ==========================================================
     MESSAGE DE CONFIRMATION
  ========================================================== */
  .form-success {
    display: none;
    font-family: var(--font-script);
    font-style: italic;
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    line-height: 1.5;
    text-align: center;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .form-success.visible {
    display: block;
    opacity: 1;
  }

  .contact-form.hidden {
    display: none;
  }

  /* ==========================================================
     INSTAGRAM — icône blanche cliquable
  ========================================================== */
  .social {
    margin-top: 3.5rem;
    display: flex;
    justify-content: center;
  }

  .social a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.25rem;
    height: 2.25rem;
    opacity: 0.85;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .social a:hover {
    opacity: 1;
    transform: translateY(-2px);
  }

  .social svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: var(--white);
    stroke-width: 1.4;
  }

  /* ==========================================================
     FOOTER
  ========================================================== */
  footer {
    text-align: center;
    padding: 2.5rem 1.5rem;
    font-family: var(--font-body);
  }

  .footer-nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 1.5rem;
    margin-bottom: 1rem;
  }

  .footer-nav a {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
    transition: color 0.3s ease;
  }

  .footer-nav a:hover {
    color: var(--white);
  }

  footer p {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding-top: 1.25rem;
  }

  /* ==========================================================
     RETOUR EN HAUT — cercle blanc, coin inférieur droit
  ========================================================== */
  .back-to-top {
    position: fixed;
    right: 1.75rem;
    bottom: 1.75rem;
    width: 3rem;
    height: 3rem;
    border-radius: 50%;
    background: var(--white);
    border: 1px solid var(--white);
    color: var(--black);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s ease,
      background-color 0.3s ease, color 0.3s ease;
    z-index: 90;
  }

  .back-to-top.visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .back-to-top:hover,
  .back-to-top:focus-visible {
    background: var(--black);
    color: var(--white);
  }

  .back-to-top svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ==========================================================
     RESPONSIVE — MOBILE
  ========================================================== */
  @media (max-width: 768px) {
    .navbar {
      padding: 1.25rem 1rem;
    }

    .navbar nav ul {
      gap: 1.1rem;
    }

    .navbar nav a {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
    }

    .page-header {
      padding: 7.5rem 1.25rem 0.5rem;
    }

    main {
      padding: 1.5rem 1.25rem 4rem;
    }

    .contact-form {
      gap: 2.25rem;
    }
  }

  @media (max-width: 480px) {
    .navbar nav ul {
      flex-wrap: wrap;
      row-gap: 0.5rem;
    }

    .back-to-top {
      right: 1.1rem;
      bottom: 1.1rem;
      width: 2.6rem;
      height: 2.6rem;
    }

    .submit-btn {
      width: 100%;
    }
  }
</style>
</head>
<body>

  <!-- NAVIGATION -->
  <header class="navbar">
    <nav aria-label="Navigation principale">
      <ul>
        <li><a href="index.html#accueil">Accueil</a></li>
        <li><a href="gallery.html">Galerie</a></li>
        <li><a href="about.html">À propos</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- EN-TÊTE DE PAGE -->
  <section class="page-header">
    <h1 class="load-in">Contact</h1>
    <p class="load-in load-in-d1">Capturing Love Stories</p>
  </section>

  <!-- CONTENU -->
  <main>
    <div class="contact-wrap">

      <form class="contact-form reveal" id="contactForm" novalidate>
        <div class="field">
          <label for="name">Nom</label>
          <input type="text" id="name" name="name" placeholder="Votre nom">
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="votre@email.com">
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Parlez-moi de votre mariage..."></textarea>
        </div>

        <button type="submit" class="submit-btn">Envoyer</button>
      </form>

      <p class="form-success" id="formSuccess">Merci. Je vous contacterai bientôt.</p>

      <!-- INSTAGRAM -->
      <div class="social reveal">
        <a href="https://instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Suivre Karina sur Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2.5" y="2.5" width="19" height="19" rx="5"></rect>
            <circle cx="12" cy="12" r="4.4"></circle>
            <circle cx="17.4" cy="6.6" r="0.9" fill="currentColor" stroke="none"></circle>
          </svg>
        </a>
      </div>

    </div>
  </main>

  <footer>
    <nav class="footer-nav" aria-label="Navigation de pied de page">
      <a href="index.html#accueil">Accueil</a>
      <a href="gallery.html">Galerie</a>
      <a href="about.html">À propos</a>
      <a href="contact.html">Contact</a>
    </nav>
    <p>&copy; 2026 Karina Photographie — Tous droits réservés</p>
  </footer>

  <!-- RETOUR EN HAUT -->
  <button id="backToTop" class="back-to-top" aria-label="Retour en haut de la page">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
  </button>

  <script>
    (function () {
      const form = document.getElementById("contactForm");
      const success = document.getElementById("formSuccess");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        form.classList.add("hidden");
        success.classList.add("visible");
      });

      // ------------------------------------------------------
      // FONDU DISCRET — apparition au défilement
      // ------------------------------------------------------
      const reveals = document.querySelectorAll(".reveal");
      if ("IntersectionObserver" in window) {
        const revealObserver = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              revealObserver.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15, rootMargin: "0px 0px -10% 0px" });
        reveals.forEach((el) => revealObserver.observe(el));
      } else {
        reveals.forEach((el) => el.classList.add("is-visible"));
      }
    })();
  </script>

  <script>
    (function () {
      const backToTop = document.getElementById("backToTop");
      if (!backToTop) return;

      function toggleBackToTop() {
        if (window.scrollY > 400) {
          backToTop.classList.add("visible");
        } else {
          backToTop.classList.remove("visible");
        }
      }

      window.addEventListener("scroll", toggleBackToTop, { passive: true });
      toggleBackToTop();

      backToTop.addEventListener("click", function () {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    })();
  </script>

</body>
</html>
