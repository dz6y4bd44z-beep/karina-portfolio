<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie — Karina</title>
<meta name="description" content="Galerie de mariages photographiés par Karina.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23000000%22/%3E%3Ctext%20x%3D%2250%22%20y%3D%2270%22%20font-family%3D%22Georgia%2C%20%27Times%20New%20Roman%27%2C%20serif%22%20font-size%3D%2262%22%20font-weight%3D%22400%22%20fill%3D%22%23ffffff%22%20text-anchor%3D%22middle%22%3EK%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Pinyon+Script&family=Viaoda+Libre&display=swap" rel="stylesheet">

<style>
  /* ==========================================================
     RESET & VARIABLES
  ========================================================== */
  :root {
    --black: #000000;
    --white: #ffffff;
    --gray-1: #1a1a1a;
    --font-display: 'Viaoda Libre', serif;
    --font-script: 'Pinyon Script', cursive;
    --font-body: 'DM Sans', sans-serif;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    background-color: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  a {
    color: var(--white);
    text-decoration: none;
  }

  img {
    max-width: 100%;
    display: block;
  }

  button {
    font-family: var(--font-body);
    cursor: pointer;
  }

  /* ==========================================================
     ANIMATIONS — fondu discret à l'entrée
  ========================================================== */
  .load-in {
    opacity: 0;
    transform: translateY(16px);
    animation: fadeRiseIn 1s ease forwards;
  }

  .load-in-d1 {
    animation-delay: 0.15s;
  }

  .load-in-d2 {
    animation-delay: 0.3s;
  }

  @keyframes fadeRiseIn {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .reveal {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  .reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .load-in {
      animation: none;
      opacity: 1;
      transform: none;
    }

    .reveal {
      transition: none;
      opacity: 1;
      transform: none;
    }
  }

  /* ==========================================================
     NAVBAR — identique à index.html
  ========================================================== */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 100;
    background: transparent;
    padding: 1.75rem 2rem;
  }

  .navbar nav ul {
    list-style: none;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(1.5rem, 4vw, 3.5rem);
  }

  .navbar nav a {
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--white);
    position: relative;
    padding-bottom: 4px;
  }

  .navbar nav a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 1px;
    background: var(--white);
    transition: width 0.3s ease;
  }

  .navbar nav a:hover::after,
  .navbar nav a:focus::after,
  .navbar nav a.active::after {
    width: 100%;
  }

  /* ==========================================================
     EN-TÊTE DE PAGE
  ========================================================== */
  .page-header {
    text-align: center;
    padding: 9rem 1.5rem 2.5rem;
  }

  .page-header h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2.5rem, 6vw, 4rem);
    letter-spacing: 0.02em;
  }

  .page-header p {
    font-family: var(--font-script);
    font-style: italic;
    font-size: clamp(1.25rem, 3vw, 1.75rem);
    margin-top: 0.5rem;
    opacity: 0.9;
  }

  /* ==========================================================
     MOSAÏQUE — mise en page en colonnes (masonry)
  ========================================================== */
  .mosaic {
    column-count: 4;
    column-gap: 1rem;
    max-width: 1300px;
    margin: 0 auto;
    padding: 1rem 1.5rem 6rem;
  }

  .mosaic-item {
    break-inside: avoid;
    margin-bottom: 1rem;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }

  .mosaic-item img {
    width: 100%;
    display: block;
    filter: grayscale(100%) contrast(1.05);
    transition: transform 0.6s ease, opacity 0.4s ease;
    opacity: 0;
  }

  .mosaic-item img.loaded {
    opacity: 1;
  }

  .mosaic-item::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.15);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }

  .mosaic-item:hover img {
    transform: scale(1.05);
  }

  .mosaic-item:hover::after {
    opacity: 1;
  }

  /* ==========================================================
     LIGHTBOX
  ========================================================== */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }

  .lightbox.active {
    opacity: 1;
    visibility: visible;
  }

  .lightbox-figure {
    position: relative;
    max-width: 88vw;
    max-height: 88vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lightbox-img {
    max-width: 88vw;
    max-height: 82vh;
    width: auto;
    height: auto;
    filter: grayscale(100%) contrast(1.05);
    opacity: 0;
    transition: opacity 0.45s ease;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
  }

  .lightbox-img.loaded {
    opacity: 1;
  }

  .lightbox-counter {
    position: absolute;
    bottom: -2.25rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: rgba(255, 255, 255, 0.6);
    white-space: nowrap;
  }

  .lightbox-close,
  .lightbox-prev,
  .lightbox-next {
    position: fixed;
    background: transparent;
    border: none;
    color: var(--white);
    z-index: 1001;
    transition: opacity 0.3s ease, transform 0.3s ease;
    opacity: 0.75;
  }

  .lightbox-close:hover,
  .lightbox-prev:hover,
  .lightbox-next:hover {
    opacity: 1;
  }

  .lightbox-close {
    top: 1.75rem;
    right: 2rem;
    font-size: 2.25rem;
    line-height: 1;
    font-weight: 300;
  }

  .lightbox-prev,
  .lightbox-next {
    top: 50%;
    transform: translateY(-50%);
    font-size: 2rem;
    padding: 0.5rem 1rem;
  }

  .lightbox-prev:hover,
  .lightbox-next:hover {
    transform: translateY(-50%) scale(1.15);
  }

  .lightbox-prev {
    left: 0.75rem;
  }

  .lightbox-next {
    right: 0.75rem;
  }

  /* ==========================================================
     FOOTER
  ========================================================== */
  footer {
    text-align: center;
    padding: 2.5rem 1.5rem;
    font-family: var(--font-body);
  }

  .footer-nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 1.5rem;
    margin-bottom: 1rem;
  }

  .footer-nav a {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
    transition: color 0.3s ease;
  }

  .footer-nav a:hover {
    color: var(--white);
  }

  footer p {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding-top: 1.25rem;
  }

  /* ==========================================================
     RETOUR EN HAUT — cercle blanc, coin inférieur droit
  ========================================================== */
  .back-to-top {
    position: fixed;
    right: 1.75rem;
    bottom: 1.75rem;
    width: 3rem;
    height: 3rem;
    border-radius: 50%;
    background: var(--white);
    border: 1px solid var(--white);
    color: var(--black);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s ease,
      background-color 0.3s ease, color 0.3s ease;
    z-index: 90;
  }

  .back-to-top.visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .back-to-top:hover,
  .back-to-top:focus-visible {
    background: var(--black);
    color: var(--white);
  }

  .back-to-top svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ==========================================================
     RESPONSIVE — MOBILE
  ========================================================== */
  @media (max-width: 1024px) {
    .mosaic {
      column-count: 3;
    }
  }

  @media (max-width: 768px) {
    .navbar {
      padding: 1.25rem 1rem;
    }

    .navbar nav ul {
      gap: 1.1rem;
    }

    .navbar nav a {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
    }

    .page-header {
      padding: 7.5rem 1.25rem 2rem;
    }

    .mosaic {
      column-count: 2;
      column-gap: 0.75rem;
      padding: 0.5rem 1rem 4rem;
    }

    .mosaic-item {
      margin-bottom: 0.75rem;
    }

    .lightbox-close {
      top: 1.1rem;
      right: 1.25rem;
      font-size: 1.9rem;
    }

    .lightbox-prev,
    .lightbox-next {
      font-size: 1.5rem;
      padding: 0.4rem 0.6rem;
    }
  }

  @media (max-width: 480px) {
    .navbar nav ul {
      flex-wrap: wrap;
      row-gap: 0.5rem;
    }

    .back-to-top {
      right: 1.1rem;
      bottom: 1.1rem;
      width: 2.6rem;
      height: 2.6rem;
    }

    .mosaic {
      column-count: 1;
    }

    .lightbox-figure {
      max-width: 94vw;
    }

    .lightbox-img {
      max-width: 94vw;
      max-height: 75vh;
    }

    .lightbox-prev {
      left: 0.25rem;
    }

    .lightbox-next {
      right: 0.25rem;
    }
  }
</style>
</head>
<body>

  <!-- NAVIGATION -->
  <header class="navbar">
    <nav aria-label="Navigation principale">
      <ul>
        <li><a href="index.html#accueil">Accueil</a></li>
        <li><a href="gallery.html" class="active">Galerie</a></li>
        <li><a href="about.html">À propos</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- EN-TÊTE DE PAGE -->
  <section class="page-header">
    <h1 class="load-in">Galerie</h1>
    <p class="load-in load-in-d1">Capturing Love Stories</p>
  </section>

  <!-- MOSAÏQUE -->
  <section class="mosaic" id="mosaic" aria-label="Galerie photo">
    <!-- Les 12 vignettes sont injectées par le script ci-dessous -->
  </section>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Aperçu de la photo">
    <button class="lightbox-close" id="lightboxClose" aria-label="Fermer">&times;</button>
    <button class="lightbox-prev" id="lightboxPrev" aria-label="Photo précédente">&#10094;</button>
    <figure class="lightbox-figure">
      <img class="lightbox-img" id="lightboxImg" src="" alt="Photo de mariage agrandie">
      <figcaption class="lightbox-counter" id="lightboxCounter"></figcaption>
    </figure>
    <button class="lightbox-next" id="lightboxNext" aria-label="Photo suivante">&#10095;</button>
  </div>

  <footer>
    <nav class="footer-nav" aria-label="Navigation de pied de page">
      <a href="index.html#accueil">Accueil</a>
      <a href="gallery.html">Galerie</a>
      <a href="about.html">À propos</a>
      <a href="contact.html">Contact</a>
    </nav>
    <p>&copy; 2026 Karina Photographie — Tous droits réservés</p>
  </footer>

  <!-- RETOUR EN HAUT -->
  <button id="backToTop" class="back-to-top" aria-label="Retour en haut de la page">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
  </button>

  <script>
    (function () {
      // ------------------------------------------------------
      // Sources d'images de remplacement (picsum.photos)
      // Remplacer chaque seed / URL par vos propres photos.
      // ------------------------------------------------------
      const photos = [
        { seed: "wedding-01", w: 800,  h: 1000 },
        { seed: "wedding-02", w: 800,  h: 600  },
        { seed: "wedding-03", w: 800,  h: 1100 },
        { seed: "wedding-04", w: 800,  h: 700  },
        { seed: "wedding-05", w: 800,  h: 950  },
        { seed: "wedding-06", w: 800,  h: 650  },
        { seed: "wedding-07", w: 800,  h: 1050 },
        { seed: "wedding-08", w: 800,  h: 750  },
        { seed: "wedding-09", w: 800,  h: 900  },
        { seed: "wedding-10", w: 800,  h: 600  },
        { seed: "wedding-11", w: 800,  h: 1000 },
        { seed: "wedding-12", w: 800,  h: 700  }
      ].map(p => ({
        thumb: `https://picsum.photos/seed/${p.seed}/${p.w}/${p.h}`,
        full: `https://picsum.photos/seed/${p.seed}/1600/${p.h * 2}`
      }));

      const mosaic = document.getElementById("mosaic");

      photos.forEach((photo, index) => {
        const item = document.createElement("div");
        item.className = "mosaic-item reveal";
        item.dataset.index = index;

        const img = document.createElement("img");
        img.src = photo.thumb;
        img.alt = `Photo de mariage ${index + 1}`;
        img.loading = "lazy";
        img.addEventListener("load", () => img.classList.add("loaded"));

        item.appendChild(img);
        item.addEventListener("click", () => openLightbox(index));
        mosaic.appendChild(item);
      });

      // ------------------------------------------------------
      // FONDU DISCRET — vignettes révélées au défilement
      // ------------------------------------------------------
      const reveals = document.querySelectorAll(".reveal");
      if ("IntersectionObserver" in window) {
        const revealObserver = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              revealObserver.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15, rootMargin: "0px 0px -10% 0px" });
        reveals.forEach((el) => revealObserver.observe(el));
      } else {
        reveals.forEach((el) => el.classList.add("is-visible"));
      }

      // ------------------------------------------------------
      // LIGHTBOX
      // ------------------------------------------------------
      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightboxImg");
      const lightboxCounter = document.getElementById("lightboxCounter");
      const btnClose = document.getElementById("lightboxClose");
      const btnPrev = document.getElementById("lightboxPrev");
      const btnNext = document.getElementById("lightboxNext");

      let currentIndex = 0;

      function showImage(index, direction) {
        currentIndex = (index + photos.length) % photos.length;
        lightboxImg.classList.remove("loaded");

        // Léger fondu enchaîné entre deux images
        setTimeout(() => {
          lightboxImg.src = photos[currentIndex].full;
          lightboxCounter.textContent = `${currentIndex + 1} / ${photos.length}`;
        }, 150);
      }

      lightboxImg.addEventListener("load", () => {
        lightboxImg.classList.add("loaded");
      });

      function openLightbox(index) {
        showImage(index);
        lightbox.classList.add("active");
        document.body.style.overflow = "hidden";
      }

      function closeLightbox() {
        lightbox.classList.remove("active");
        lightboxImg.classList.remove("loaded");
        document.body.style.overflow = "";
      }

      function nextImage() {
        showImage(currentIndex + 1, "next");
      }

      function prevImage() {
        showImage(currentIndex - 1, "prev");
      }

      btnClose.addEventListener("click", closeLightbox);
      btnNext.addEventListener("click", nextImage);
      btnPrev.addEventListener("click", prevImage);

      // Fermer en cliquant en dehors de l'image
      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLightbox();
      });

      // Navigation au clavier
      document.addEventListener("keydown", (e) => {
        if (!lightbox.classList.contains("active")) return;
        if (e.key === "Escape") closeLightbox();
        if (e.key === "ArrowRight") nextImage();
        if (e.key === "ArrowLeft") prevImage();
      });
    })();
  </script>

  <script>
    (function () {
      const backToTop = document.getElementById("backToTop");
      if (!backToTop) return;

      function toggleBackToTop() {
        if (window.scrollY > 400) {
          backToTop.classList.add("visible");
        } else {
          backToTop.classList.remove("visible");
        }
      }

      window.addEventListener("scroll", toggleBackToTop, { passive: true });
      toggleBackToTop();

      backToTop.addEventListener("click", function () {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    })();
  </script>

</body>
</html>
